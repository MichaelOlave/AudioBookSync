services:
  nginx:
    image: nginx:alpine
    container_name: audiobooksync-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - minio
    networks:
      - audiobooksync-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: audiobooksync-dev
    working_dir: /workspace
    expose:
      - "8000"
    volumes:
      - ..:/workspace
      - /workspace/.git
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: audiobooksync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      REDIS_HOST: redis
      LOG_LEVEL: INFO
      USE_CELERY_TASKS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiobooksync-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15-alpine
    container_name: audiobooksync-postgres
    environment:
      POSTGRES_DB: audiobooksync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
    networks:
      - audiobooksync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audiobooksync"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: audiobooksync-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - audiobooksync-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: audiobooksync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - audiobooksync-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: audiobooksync-celery-worker
    working_dir: /workspace
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: audiobooksync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiobooksync-network
    command: celery -A src.celery_app worker -l info --concurrency=2
    volumes:
      - ..:/workspace

  celery-beat:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: audiobooksync-celery-beat
    working_dir: /workspace
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: audiobooksync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiobooksync-network
    command: celery -A src.celery_app beat -l info
    volumes:
      - ..:/workspace

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  audiobooksync-network:
    driver: bridge
