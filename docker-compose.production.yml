services:
  nginx:
    image: nginx:alpine
    container_name: audiobooksync-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.devcontainer/nginx-production.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certificates from host
      # Create /home/user/audiobooksync/certs directory with:
      # - fullchain.pem (from Let's Encrypt or your CA)
      # - privkey.pem (from Let's Encrypt or your CA)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - minio
    networks:
      - audiobooksync-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: audiobooksync-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiYWQ2NjY4NGQxMDNkODNkODFiNWNjMDcxNmM2ZTA4OGQwZWIiLCJ0IjoiYmMxMGE4YTUtYzU4NS00MTAzLTg3NjgtNmI3OGI3NmUwM2RlIiwicyI6Ik9XRXhOMkUyTkdJdE5HVTBNUzAwWkRObUxUZzFaRGN0TmpReE1UVXpZVEpsWmpReSJ9
    networks:
      - audiobooksync-network
    depends_on:
      - nginx
    healthcheck:
      test:
        [
          "CMD",
          "cloudflared",
          "tunnel",
          "--config",
          "~/.cloudflared/config.yml",
          "info",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    image: michaelolave/audiobook-sync:latest
    container_name: audiobooksync-api
    restart: always
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
      - ./audiobooks:/app/audiobooks
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-audiobooksync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Security - CHANGE THESE IN PRODUCTION
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      # CORS - Update to match your Vercel domain
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-frontend.vercel.app}
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false" # Nginx handles HTTPS
      USE_MINIO_STORAGE: "true"
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      USE_CELERY_TASKS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - audiobooksync-network

  postgres:
    image: postgres:16-alpine
    container_name: audiobooksync-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiobooksync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - audiobooksync-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-audiobooksync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audiobooksync-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - audiobooksync-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: audiobooksync-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - audiobooksync-network
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    image: michaelolave/audiobook-sync:latest
    container_name: audiobooksync-celery-worker
    restart: always
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-audiobooksync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiobooksync-network
    command: celery -A src.celery_app worker -l info --concurrency=2
    volumes:
      - ./logs:/app/logs
      - ./audiobooks:/app/audiobooks

  celery-beat:
    image: michaelolave/audiobook-sync:latest
    container_name: audiobooksync-celery-beat
    restart: always
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-audiobooksync}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audiobooksync-network
    command: celery -A src.celery_app beat -l info
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  audiobooksync-network:
    driver: bridge
