[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    db: marks tests as database tests
    performance: marks tests as performance benchmarks (deselect with '-m "not performance"')
    benchmark: marks tests as benchmark comparisons (deselect with '-m "not benchmark"')
    load_test: marks tests as load tests (deselect with '-m "not load_test"')
asyncio_mode = auto
